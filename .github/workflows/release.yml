name: Release

# Push a tag like v0.4.2 to build the .xpi and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: tools/build.sh

      - name: Check the tag matches the version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src/manifest.json"))["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/zen-tree-tabs-with-folders-*.xpi --title "$GITHUB_REF_NAME" --generate-notes
